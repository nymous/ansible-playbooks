- name: Copy Nextcloud configuration
  become: true
  ansible.builtin.template:
    src: nextcloud.config.php.j2
    dest: "{{ nextcloud_config_directory }}/config.php"
    owner: nextcloud
    group: www-data
    mode: "660"
  notify: Reload PHP-FPM pool service

- name: Retrieve Nextcloud configuration sample
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: "{{ nextcloud_code_directory }}/config/config.sample.php"
    dest: "{{ nextcloud_config_directory }}/config.sample.php"
    owner: nextcloud
    group: www-data
    mode: "644"

- name: Create CAN_INSTALL file
  become: true
  ansible.builtin.file:
    path: "{{ nextcloud_config_directory }}/CAN_INSTALL"
    state: touch
    owner: nextcloud
    group: www-data
    mode: "660"
    modification_time: preserve
    access_time: preserve
  when: nextcloud_first_install

- name: Test if Nextcloud config directory links to /etc
  become: true
  ansible.builtin.stat:
    path: "{{ nextcloud_code_directory }}/config"
  register: config_dir_stat

- name: Delete existing Nextcloud config directory
  become: true
  ansible.builtin.file:
    path: "{{ nextcloud_code_directory }}/config"
    state: absent
  when: not (config_dir_stat.stat.islnk and config_dir_stat.stat.lnk_source == nextcloud_config_directory)

- name: Link Nextcloud configuration
  become: true
  ansible.builtin.file:
    src: "{{ nextcloud_config_directory }}"
    dest: "{{ nextcloud_code_directory }}/config"
    state: link
    owner: nextcloud
    group: www-data
  when: not (config_dir_stat.stat.islnk and config_dir_stat.stat.lnk_source == nextcloud_config_directory)

- name: Link Nextcloud extra apps
  become: true
  ansible.builtin.file:
    src: "{{ nextcloud_apps_directory }}"
    dest: "{{ nextcloud_code_directory }}/{{ nextcloud_extra_apps_url }}"
    state: link
    owner: nextcloud
    group: www-data

- name: Create Nextcloud PostgreSQL user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: nextcloud
    password: "{{ nextcloud_db_password }}"
    role_attr_flags: NOSUPERUSER

- name: Create Nextcloud PostgreSQL user
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: nextcloud
    owner: nextcloud
