- name: Download Nextcloud archive
  become: true
  ansible.builtin.get_url:
    url: "{{ nextcloud_archive_download_url }}"
    dest: /tmp/nextcloud-{{ nextcloud_version }}.tar.bz2
    checksum: "{{ nextcloud_archive_checksum }}"
    owner: root
    group: root
    mode: "600"

