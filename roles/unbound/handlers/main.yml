- name: Reload Unbound
  become: true
  ansible.builtin.systemd_service:
    name: unbound.service
    state: reloaded

- name: Restart Unbound
  become: true
  ansible.builtin.systemd_service:
    name: unbound.service
    state: restarted

- name: Reapply nmcli device configuration
  become: true
  ansible.builtin.command:
    argv:
      - nmcli
      - device
      - reapply
      - eth0
