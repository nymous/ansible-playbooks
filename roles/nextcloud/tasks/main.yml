- name: Create Nextcloud user
  become: true
  ansible.builtin.user:
    name: nextcloud
    password: '!' # Lock/disable password
    shell: /sbin/nologin
    system: true
    create_home: false
    groups:
      - www-data

- name: Install missing PHP extensions and tools
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - lbzip2 # To decompress Nextcloud bz2 archive
      - python3-psycopg2 # To manage PostgreSQL using Ansible
      - ffmpeg
      - php{{ nextcloud_php_version }}-apcu
      - php{{ nextcloud_php_version }}-curl
      - php{{ nextcloud_php_version }}-gd
      - php{{ nextcloud_php_version }}-imagick
      - php{{ nextcloud_php_version }}-intl
      - php{{ nextcloud_php_version }}-mbstring
      - php{{ nextcloud_php_version }}-pgsql
      - php{{ nextcloud_php_version }}-xml
      - php{{ nextcloud_php_version }}-zip
  notify: Reload PHP-FPM pool service

- name: Copy PHP-FPM pool configuration
  become: true
  ansible.builtin.template:
    src: nextcloud-pool.conf.j2
    dest: /etc/php/{{ nextcloud_php_version }}/fpm/pool.d/nextcloud.conf
    owner: root
    group: root
    mode: "644"
  notify: Reload PHP-FPM pool service

# https://albert.cx/20181125-use-separate-systemd-units-for-php-fpm-pools
- name: Copy PHP-FPM pool systemd service
  become: true
  ansible.builtin.template:
    src: php-fpm-nextcloud.service.j2
    dest: /etc/systemd/system/php{{ nextcloud_php_version }}-fpm-nextcloud.service
    owner: root
    group: root
    mode: "644"
  notify: Reload PHP-FPM pool service

- name: Start PHP-FPM pool service
  become: true
  ansible.builtin.systemd_service:
    name: php{{ nextcloud_php_version }}-fpm-nextcloud.service
    state: started
    enabled: true
    daemon_reload: true

- name: Copy nginx configuration
  become: true
  ansible.builtin.template:
    src: nextcloud-nginx.j2
    dest: /etc/nginx/sites-available/nextcloud
    owner: root
    group: root
    mode: "644"
  notify: Reload nginx

- name: Activate nginx configuration
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/nextcloud
    dest: /etc/nginx/sites-enabled/nextcloud
    state: link
  notify: Reload nginx

- name: Create Nextcloud directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nextcloud
    group: www-data
    mode: "770"
  loop:
    - "{{ nextcloud_config_directory }}"
    - "{{ nextcloud_code_directory }}"
    - "{{ nextcloud_log_directory }}"
    - "{{ nextcloud_lib_directory }}"
    - "{{ nextcloud_data_directory }}"
    - "{{ nextcloud_apps_directory }}"

