- name: Add deb.sury.org repository signing keys
  become: true
  ansible.builtin.apt:
    deb: https://packages.sury.org/debsuryorg-archive-keyring.deb
    state: present

- name: Add deb.sury.org APT repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg] https://packages.sury.org/php/ {{ ansible_distribution_release }} main"
    state: present
    update_cache: true

- name: Add deb.sury.org to unattended-upgrades
  become: true
  ansible.builtin.template:
    src: unattended-upgrades-debsuryorg.j2
    dest: /etc/apt/apt.conf.d/51custom-unattended-upgrades-debsuryorg
    owner: root
    group: root
    mode: '644'

- name: Install PHP-FPM
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - php{{ item }}
      - php{{ item }}-fpm
    state: present
  loop: "{{ php_versions }}"

- name: Configure PHP timezone
  become: true
  ansible.builtin.lineinfile:
    path: /etc/php/{{ item[0] }}/{{ item[1] }}/php.ini
    search_string: date.timezone =
    line: date.timezone = Etc/UTC
  loop: "{{ php_versions | product(['fpm', 'cli']) | list }}"

- name: Disable PHP X-Powered-By leak
  become: true
  ansible.builtin.lineinfile:
    path: /etc/php/{{ item }}/fpm/php.ini
    search_string: expose_php =
    line: expose_php = Off
  loop: "{{ php_versions }}"

- name: Disable default pool service
  become: true
  ansible.builtin.systemd_service:
    name: php{{ item }}-fpm.service
    state: stopped
    enabled: false
    masked: true
  loop: "{{ php_versions }}"

